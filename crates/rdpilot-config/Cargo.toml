[package]
name = "rdpilot-config"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "LGPL-3.0-or-later"
description = "Configuration for rdpilot: ssh_config-style hosts file and rdp:// targets, plus daemon-local settings (config.toml). Zero dependency on rdpilot/IronRDP — thin clients link this crate only."
repository = "https://github.com/marcfargas/rdpilot"

[dependencies]
serde = { version = "1", features = ["derive"] }
config = { version = "0.15.25", default-features = false, features = ["toml"] }
directories = "6.0.0"
thiserror = "2"
url = "2.5"
percent-encoding = "2.3"
glob = "0.3"

[dev-dependencies]
tempfile = "3"
