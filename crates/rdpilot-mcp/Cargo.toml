[package]
name = "rdpilot-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "LGPL-3.0-or-later"
description = "Thin target-bound Cua MCP stdio endpoint (`rdpilot-mcp` binary) — forwards native Cua MCP via a target-bound stdio stream. Never links `rdpilot`/`rdpilot-daemon` (thin-client invariant, D-17)."
repository = "https://github.com/marcfargas/rdpilot"

[[bin]]
name = "rdpilot-mcp"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rdpilot-ipc = { path = "../rdpilot-ipc" }
tokio = { version = "1", features = ["rt", "net", "io-util", "io-std", "macros", "time"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["process", "test-util"] }
