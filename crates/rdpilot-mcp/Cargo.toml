[package]
name = "rdpilot-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "LGPL-3.0-or-later"
description = "Thin `rdpilot-ipc`/`rdpilot-config` MCP server client (`rdpilot-mcp` binary) — exposes rdpilot over the Model Context Protocol via rmcp's stdio transport. Never links `rdpilot`/`rdpilot-daemon` (thin-client invariant, D-17)."
repository = "https://github.com/marcfargas/rdpilot"

[[bin]]
name = "rdpilot-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "2.2.0", features = ["server", "macros", "transport-io"] }
schemars = "1"
rdpilot-ipc = { path = "../rdpilot-ipc" }
rdpilot-config = { path = "../rdpilot-config" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "io-std", "macros", "time"] }
serde = "1"
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
