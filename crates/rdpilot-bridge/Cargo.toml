[package]
name = "rdpilot-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rdpilot-bridge-protocol = { path = "../rdpilot-bridge-protocol" }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sha2 = "0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_RemoteDesktop", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_System_IO", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
