[package]
name = "rdpilot"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "LGPL-3.0-or-later"
description = "SDK that opens and manages an RDP session to a remote Windows machine and exposes it as a controllable, perceivable surface."
repository = "https://github.com/marcfargas/rdpilot"

[dependencies]
# IronRDP: umbrella facade at 0.15, member crates at their independent versions.
# Uniform "0.14" pins will NOT resolve (member crates are at 0.9/0.8/0.6/0.2).
# Versions verified against the crates.io sparse index 2026-06-05 (see 02-RESEARCH.md).
# The umbrella defaults to only `core`+`pdu`; the connect path / active session loop
# need the connector state machine, the session (`ActiveStage`/`ActiveStageOutput`),
# graphics (`DecodedImage`/`PixelFormat`), input, and the DVC seam — enable them here.
ironrdp = { version = "0.15", features = [
    "connector",
    "session",
    "graphics",
    "input",
    "dvc",
    "svc",
] }
# The `reqwest` feature provides `ReqwestNetworkClient`, the CredSSP/KDC network
# client `connect_finalize` requires (the umbrella `sspi` does not expose it
# without its own `network_client` feature; the tokio crate is the supported seam).
ironrdp-tokio = { version = "0.9", features = ["reqwest"] }
# `ironrdp-tls` requires exactly one TLS backend feature; select `rustls` to
# match the hand-built rustls ClientConfig path (D-15 custom cert verifier).
ironrdp-tls = { version = "0.2", default-features = false, features = ["rustls"] }
ironrdp-dvc = "0.6"
ironrdp-input = "0.6"
ironrdp-pdu = "0.8"
# RDPDR (drive-redirection) primary launch path (05-02, SENSOR-02, D-5.1).
# Same Devolutions/IronRDP release train as the sibling ironrdp-* crates
# above; the empty "-native" sibling crate is deliberately NOT added
# (05-RESEARCH Pitfall 2: empty on the pinned x86_64-pc-windows-gnu target)
# -- the SDK supplies its own std::fs-based backend (rdpdr_backend.rs, Task 3).
ironrdp-rdpdr = "0.6"
# Minimal "rdpsnd" static-channel stub (05-04 live-gate bug fix, see
# rdpsnd_stub.rs doc comment): MS-RDPEFS Appendix A footnote <1> requires the
# audio channel to be advertised alongside rdpdr or a Windows RDP server
# silently never sends the Server Announce Request that starts the RDPDR
# handshake. `ironrdp-rdpdr` itself re-exports these SvcProcessor traits
# internally but does not expose them publicly, so this crate is added
# directly (same release train, already resolved transitively via
# ironrdp-rdpdr's own dependency graph -- see Cargo.lock).
ironrdp-svc = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
rustls = "0.23"
sspi = "0.21"
image = "0.25"
thiserror = "2"
tracing = "0.1"
x509-cert = "0.2"
rustls-native-certs = "0.8.4"
# SHA-256 checksum verification for file transfer (D-10.5, FILE-02). Already
# resolved transitively in Cargo.lock at 0.11.0 (pulled by the TLS/x509 chain)
# -- promoting to a direct dependency introduces no new supply-chain node
# (10-RESEARCH Package Legitimacy Audit: slopcheck [OK]).
sha2 = "0.11"

[dev-dependencies]
# "test-util" enables Tokio's paused/mocked clock (`#[tokio::test(start_paused
# = true)]`), used by session.rs's TRANSFER_TIMEOUT_MS (30s) offline timeout
# test (Plan 10-04) so it proves the bound without a real 30-second wait.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
serial_test = "3"
