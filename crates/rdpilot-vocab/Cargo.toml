[package]
name = "rdpilot-vocab"
version.workspace = true
edition.workspace = true
rust-version = "1.78"
license.workspace = true
description = "Shared input, recording-trigger and wire-error-code vocabulary for rdpilot. Depends on serde only: the SDK, the IPC protocol, the daemon, the CLI and the config crate all use these types, and thin clients link them without IronRDP."
repository = "https://github.com/marcfargas/rdpilot"

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
