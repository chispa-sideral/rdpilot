[package]
name = "rdpilot-daemon"
version.workspace = true
edition.workspace = true
rust-version = "1.78"
license.workspace = true
description = "Long-lived local IPC daemon that owns rdpilot's in-memory session registry (DAEMON-01/02/03/04, SESSION-01/03/04). The only crate legitimately depending on both rdpilot and rdpilot-ipc."
repository = "https://github.com/marcfargas/rdpilot"

[lib]
name = "rdpilot_daemon"
path = "src/lib.rs"

[[bin]]
name = "rdpilot-daemon"
path = "src/main.rs"

[dependencies]
rdpilot = { path = "../rdpilot" }
rdpilot-ipc = { path = "../rdpilot-ipc" }
rdpilot-config = { path = "../rdpilot-config" }
rdpilot-bridge-protocol = { path = "../rdpilot-bridge-protocol" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6.0.0"
thiserror = "2"
# Dispatch-side screenshot PNG -> base64 encoding (Plan 13-04). Legitimacy
# gate (developer-approved, 13-04-PLAN.md Task 2): slopcheck [OK], crates.io
# identity confirmed (github.com/marshallpierce/rust-base64), pinned to the
# live current version at plan-execution time. Plan 13-06's CLI addition
# reuses this exact pin.
base64 = "0.22.1"
# Read-only live viewer: HTTP/1.1 server on explicit loopback and
# tailnet addresses. hyper, hyper-util, http-body-util, bytes, subtle and
# getrandom were already resolved in Cargo.lock (via ironrdp-tokio/reqwest and
# the TLS chain) at these versions; promoting them to direct dependencies adds
# no new supply-chain node. Only the `server`/`http1` (hyper) and `tokio`
# (hyper-util) features are new. crates.io identities: hyperium/hyper,
# hyperium/hyper-util, hyperium/http-body, tokio-rs/bytes, dalek-cryptography/
# subtle, rust-random/getrandom. slopcheck scan: see the execution report.
hyper = { version = "1.10.1", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
http-body-util = "0.1.3"
bytes = "1.11.1"
subtle = "2.6.1"
getrandom = "0.3.4"
# Interface enumeration for Tailscale address detection. New to the lockfile:
# crates.io identity github.com/messense/if-addrs, MIT OR BSD-3-Clause; its
# Windows dependency is windows-sys 0.61 (the line already in Cargo.lock),
# its Unix dependency libc.
if-addrs = "0.15.0"
# Cua bundle download (bundle module). reqwest 0.12.28, rustls 0.23,
# rustls-native-certs 0.8, semver 1.0.28, sha2 0.11 and flate2 were already
# resolved in Cargo.lock; the daemon passes reqwest a rustls ClientConfig
# built with the aws-lc-rs provider the SDK already uses, so no second TLS
# or crypto provider is enabled. zip is new: crates.io identity
# github.com/zip-rs/zip2, MIT, default features off (deflate via flate2 only).
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-manual-roots-no-provider", "system-proxy"] }
rustls = "0.23"
rustls-native-certs = "0.8.4"
semver = "1.0.28"
sha2 = "0.11"
zip = { version = "4.2.0", default-features = false, features = ["deflate-flate2"] }
# Selects flate2's pure-Rust (miniz_oxide) backend for zip; already in Cargo.lock.
flate2 = "1.1.9"

[target.'cfg(unix)'.dependencies]
# Fallback for effective-uid retrieval if tokio's peer_cred() needs a
# companion (Plan 12-04, DAEMON-02's Unix path).
libc = "0.2.186"

[target.'cfg(windows)'.dependencies]
# Explicit owner-only named-pipe DACL construction (Plan 15-01, closing
# 12-07's Windows half of DAEMON-02) via raw Win32 calls: OpenProcessToken
# -> GetTokenInformation(TokenUser) -> InitializeSecurityDescriptor ->
# InitializeAcl -> AddAccessAllowedAce -> SetSecurityDescriptorDacl (see
# `ipc/windows.rs`). Microsoft-official, already lockfile-resolved as a
# transitive dependency (0.61.2, pulled in by `tokio`/`mio`/`socket2`
# among others) -- per binding direction 3 this needs NO package-
# legitimacy checkpoint (unlike the `[ASSUMED]` `windows-permissions`
# 12-07-PLAN.md Task 1 would otherwise have required). Pinned to the SAME
# 0.61.2 line already resolved in Cargo.lock -- deliberately not a second
# major version.
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_Memory",
    # SECURITY_DESCRIPTOR_REVISION lives here, not Win32_Security, in
    # windows-sys 0.61.2 (live-VM-confirmed correction, Plan 15-05).
    "Win32_System_SystemServices",
    # CreateDirectoryW with an owner-only DACL for recording directories.
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
# DAEMON-01 soak-test RSS baseline/return-to-baseline assertion (Plan 12-03).
sysinfo = "0.39.6"
tempfile = "3"
