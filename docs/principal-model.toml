# Operation x principal table. Source of truth for the policy table.
# Format and use: docs/principal-model.md.

schema = 1
principals = ["socket_owner", "agent", "human"]
classes = ["read", "act", "transfer", "admin", "credential-command"]
decisions = ["allow", "allow-with-lease", "deny"]

[[operation]]
adapter = "ipc"
name = "Connect"
class = "credential-command"
authentication = ["socket-peer"]
summary = "Open a session to a host; the request carries the password."
decision = { socket_owner = "allow", agent = "allow", human = "allow" }
current = "The CLI resolves Password or PasswordCommand (shell-expanded) and sends the plaintext password in the request; the daemon opens the session."
delta = "Saved-host connects resolve in the daemon (see connect-saved-host). An explicit password is input only and is never returned to any principal."
evidence = ["crates/rdpilot-ipc/src/request.rs:7", "crates/rdpilot-ipc/src/request.rs:12", "crates/rdpilot-daemon/src/dispatch.rs:243", "crates/rdpilot-cli/src/verbs/session.rs:47"]

[[operation]]
