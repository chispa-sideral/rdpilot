authentication = ["socket-peer"]
summary = "Acknowledge a Connect stream; part of Connect."
decision = { socket_owner = "allow", agent = "allow", human = "allow" }
current = "Valid only inside the Connect stream; sent alone it is an error."
delta = "none"
evidence = ["crates/rdpilot-ipc/src/request.rs:30", "crates/rdpilot-daemon/src/ipc/mod.rs:196", "crates/rdpilot-daemon/src/dispatch.rs:278"]

