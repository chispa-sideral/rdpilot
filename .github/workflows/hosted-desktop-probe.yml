name: Desktop host diagnostics

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Diagnostic scope
        type: choice
        required: true
        default: setup
        options: [setup, cua, baseline]
      bootstrap_desktop:
        description: Retain bounded first-user bootstrap desktop snapshots
        type: boolean
        required: false
        default: false

      bootstrap_footprint:
        description: Snapshot residual first-user bootstrap candidate files after failure
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  reject-unknown-mode:
    if: ${{ (inputs.mode != 'setup' && inputs.mode != 'cua' && inputs.mode != 'baseline') || ((inputs.bootstrap_desktop || inputs.bootstrap_footprint) && inputs.mode != 'cua') || (inputs.bootstrap_desktop && inputs.bootstrap_footprint) }}
    runs-on: windows-2025
    timeout-minutes: 1
    steps:
      - shell: pwsh
        run: throw 'Unknown desktop diagnostic mode'
  setup:
    if: ${{ inputs.mode == 'setup' && !inputs.bootstrap_desktop && !inputs.bootstrap_footprint }}
    name: Host setup and cleanup only (no RDP proof)
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Initialize safe setup evidence
        shell: pwsh
        run: python scripts/ci/hosted_desktop.py --setup-diagnostic --initialize --output "$env:RUNNER_TEMP/setup-diagnostic"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Measure owned host setup and cleanup
        shell: pwsh
        run: python scripts/ci/hosted_desktop.py --setup-diagnostic --output "$env:RUNNER_TEMP/setup-diagnostic" --expected-commit "${{ github.sha }}"
      - name: Safe setup diagnosis
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-setup-diagnostic
          path: ${{ runner.temp }}/setup-diagnostic/artifacts/
          retention-days: 7
          if-no-files-found: error

  baseline:
    if: ${{ inputs.mode == 'baseline' && !inputs.bootstrap_desktop && !inputs.bootstrap_footprint }}
    name: Protected earlier startup FIRST-A capability (not full Cua)
    runs-on: windows-2025
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Initialize red baseline evidence
        timeout-minutes: 1
        shell: pwsh
        run: python scripts/ci/hosted_desktop.py --baseline-first-a --initialize --output "$env:RUNNER_TEMP/first-a-diagnostic"
      - timeout-minutes: 5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned helper dependency
        timeout-minutes: 5
        run: python -m pip install Pillow==12.3.0
      - name: Native lifecycle and FIRST-A policy controls
        timeout-minutes: 10
        shell: pwsh
        env:
          PYTHONPATH: scripts/ci
        run: python -m unittest test_hosted_lifecycle test_first_a -v
      - name: Mandatory native footprint helper gate
        timeout-minutes: 10
        run: python -m unittest discover -s scripts/ci -p 'test_guest_footprint_observer.py' -v
      - name: Verify frozen source inputs before build
        timeout-minutes: 2
        shell: pwsh
        run: python scripts/ci/first_a.py --verify-source --expected-commit '${{ github.sha }}' --output "$env:RUNNER_TEMP/first-a-diagnostic/artifacts"
      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 5
      - timeout-minutes: 5
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Enable MSVC developer environment
        timeout-minutes: 5
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Build unchanged source desktop binaries
        timeout-minutes: 20
        run: cargo build --release --locked -p rdpilot-cli -p rdpilot-daemon -p rdpilot-mcp -p rdpilot-bridge --target x86_64-pc-windows-msvc
      - name: Protected FIRST-A and owned cleanup
        id: proof
        timeout-minutes: 45
        shell: pwsh
        run: python scripts/ci/hosted_desktop.py --baseline-first-a --bin-dir target/x86_64-pc-windows-msvc/release --output "$env:RUNNER_TEMP/first-a-diagnostic" --expected-commit '${{ github.sha }}'
      - name: Normalize failed selected child evidence
        if: ${{ always() && steps.proof.outcome != 'success' }}
        timeout-minutes: 1
        shell: pwsh
        env:
          PYTHONPATH: scripts/ci
        run: |
          $normalize = @'
          import os
          from pathlib import Path
          import first_a
          root = Path(os.environ['RUNNER_TEMP']) / 'first-a-diagnostic' / 'artifacts'
          try:
              raw = first_a.read_json(root / 'first_a.json')
          except BaseException:
              raw = None
          first_a.write_json(root / 'failed-first_a.json', first_a.failed_selected(raw))
          '@
          python -c $normalize
          exit $LASTEXITCODE
      - name: Safe FIRST-A diagnostic evidence
        timeout-minutes: 5
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-first-a-diagnostic
          path: |
            ${{ runner.temp }}/first-a-diagnostic/artifacts/gate.json
            ${{ runner.temp }}/first-a-diagnostic/artifacts/source.json
            ${{ runner.temp }}/first-a-diagnostic/artifacts/environment.json
            ${{ runner.temp }}/first-a-diagnostic/artifacts/account-roles.json
            ${{ runner.temp }}/first-a-diagnostic/artifacts/cleanup.json
            ${{ steps.proof.outcome == 'success' && format('{0}/first-a-diagnostic/artifacts/first_a.json', runner.temp) || format('{0}/first-a-diagnostic/artifacts/failed-first_a.json', runner.temp) }}
            ${{ runner.temp }}/first-a-diagnostic/artifacts/local-acquisition.json
          retention-days: 7
          if-no-files-found: error

  cua:
    if: ${{ inputs.mode == 'cua' && !(inputs.bootstrap_desktop && inputs.bootstrap_footprint) }}
    name: Full Cua diagnosis and owned cleanup (no browser proof)
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Initialize safe Cua diagnostic evidence
        shell: pwsh
        run: python scripts/ci/hosted_desktop.py --cua-diagnostic --initialize --output "$env:RUNNER_TEMP/cua-diagnostic"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Enable MSVC developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify guest footprint helper on Windows
        if: ${{ inputs.bootstrap_footprint }}
        run: python -m unittest discover -s scripts/ci -p 'test_guest_footprint_observer.py' -v
      - name: Bootstrap image validator
        if: ${{ inputs.bootstrap_desktop }}
        run: python -m pip install Pillow==12.3.0
      - name: Build source desktop binaries
        timeout-minutes: 20
        run: cargo build --release --locked -p rdpilot-cli -p rdpilot-daemon -p rdpilot-mcp -p rdpilot-bridge --target x86_64-pc-windows-msvc
      - name: Diagnose full Cua and owned cleanup
        timeout-minutes: 25
        shell: pwsh
        env:
          BOOTSTRAP_DESKTOP: ${{ inputs.bootstrap_desktop }}
          BOOTSTRAP_FOOTPRINT: ${{ inputs.bootstrap_footprint }}
        run: |
          $proofArgs = @('scripts/ci/hosted_desktop.py', '--cua-diagnostic', '--bin-dir', 'target/x86_64-pc-windows-msvc/release', '--output', "$env:RUNNER_TEMP/cua-diagnostic", '--expected-commit', '${{ github.sha }}')
          if ($env:BOOTSTRAP_DESKTOP -eq 'true') { $proofArgs += '--bootstrap-desktop' }
          if ($env:BOOTSTRAP_FOOTPRINT -eq 'true') { $proofArgs += '--bootstrap-footprint' }
          python @proofArgs
          exit $LASTEXITCODE
      - name: Safe Cua diagnosis
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-cua-diagnostic
          path: ${{ runner.temp }}/cua-diagnostic/artifacts/
          retention-days: 7
          if-no-files-found: error
