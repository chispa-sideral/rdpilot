name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  checks:
    name: Required tagged-source checks
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  bridge:
    name: Publish rdpilot-bridge.exe
    runs-on: windows-latest
    needs: [checks]
    if: ${{ needs.checks.result == 'success' }}
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Check that the tag matches the workspace version
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "rdpilot-bridge") | .version')
          if [ "v${version}" != "${TAG}" ]; then
            echo "tag ${TAG} does not match workspace version ${version}" >&2
            exit 1
          fi

      - name: Check that the tagged commit is on develop
        run: |
          git fetch --no-tags origin develop
          git merge-base --is-ancestor "${GITHUB_SHA}" FETCH_HEAD

      - name: Build rdpilot-bridge.exe
        run: cargo build -p rdpilot-bridge --release --locked --target x86_64-pc-windows-msvc

      - name: Write SHA256SUMS
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/rdpilot-bridge.exe dist/
          cd dist
          hash=$(sha256sum -b rdpilot-bridge.exe | cut -d' ' -f1 | tr 'A-F' 'a-f')
          printf '%s  rdpilot-bridge.exe\n' "${hash}" > SHA256SUMS
          cat SHA256SUMS

      - name: Resume draft, verify assets and publish
        run: |
          python scripts/ci/publish-bridge-release.py \
            --repo "${GITHUB_REPOSITORY}" --tag "${TAG}" \
            --source-sha "${GITHUB_SHA}" --dist dist
