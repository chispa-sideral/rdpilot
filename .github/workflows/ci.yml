name: CI

on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      perf_workload:
        description: Run the performance workload on the hosted desktop runner (skips the other live proofs of the desktop job)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linux:
    name: Linux checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo check --workspace --all-targets --locked
      - name: Rust workspace tests
        run: cargo test --workspace --locked
      - name: Python for CI helper tests
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: CI and publisher failure-injection tests
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'

  windows:
    name: Windows config and CLI unit tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Config unit tests
        run: cargo test -p rdpilot-config --locked
      - name: CLI unit tests
        run: cargo test -p rdpilot-cli --bins --locked

  windows-dacl:
    name: Windows DACL
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Enable MSVC developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Windows Clippy
        run: cargo clippy -p rdpilot-daemon -p rdpilot-ipc -p rdpilot-bridge --all-targets --locked -- -D warnings
      - name: Python for publisher tests
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: CI and publisher failure-injection tests
        run: python -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Live daemon DACL tests
        shell: pwsh
        run: ./scripts/ci/run-windows-dacl.ps1

      - name: Windows bridge and containment tests
        run: cargo test -p rdpilot-bridge --lib --tests --locked

  offline:
    name: Offline viewer, recording and takeover proofs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Browser and media dependencies
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium firefox
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Build proof binaries
        id: build
        run: cargo build --locked -p rdpilot-cli -p rdpilot-daemon -p rdpilot-mcp
      - name: Offline viewer proof
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python scripts/ci/run-offline-proof.py viewer --bin-dir target/debug --output "$RUNNER_TEMP/offline-viewer"
      - name: Offline recording proof
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python scripts/ci/run-offline-proof.py recording --bin-dir target/debug --output "$RUNNER_TEMP/offline-recording"
      - name: Offline takeover proof
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python scripts/ci/run-offline-proof.py takeover --bin-dir target/debug --output "$RUNNER_TEMP/offline-takeover"
      - name: Offline perf workload smoke
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python scripts/ci/run-offline-proof.py perf --bin-dir target/debug --output "$RUNNER_TEMP/offline-perf"
      - name: Sanitized offline proof summaries
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-proof-summaries
          path: |
            ${{ runner.temp }}/offline-viewer/artifact-summary.json
            ${{ runner.temp }}/offline-recording/artifact-summary.json
            ${{ runner.temp }}/offline-takeover/artifact-summary.json
            ${{ runner.temp }}/offline-perf/artifact-summary.json
          retention-days: 7
          if-no-files-found: warn

  desktop:
    name: Live RDP bridge, Cua, viewer and takeover proofs
    runs-on: windows-latest
    # At least the sum of the step timeouts of the longest path, plus setup and
    # upload. A push runs build, browser, Cua, viewer and takeover (120). The
    # on-demand perf dispatch skips the three live proofs and runs build,
    # browser and the perf step (70).
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Enable MSVC developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build the source bridge and clients
        id: build
        timeout-minutes: 30
        run: cargo build --release --locked -p rdpilot-cli -p rdpilot-daemon -p rdpilot-mcp -p rdpilot-bridge --target x86_64-pc-windows-msvc
      - name: Browser for the viewer and takeover proofs
        id: browser
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          python -m pip install playwright==1.63.0 Pillow==12.3.0
          python -m playwright install chromium
      # Each proof creates its own users and restores the runner; it stops its
      # harness a few minutes before the step timeout so that cleanup still runs.
      - name: Live Cua proof
        if: ${{ !cancelled() && steps.build.outcome == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.perf_workload) }}
        timeout-minutes: 40
        shell: pwsh
        run: ./scripts/ci/run-hosted-desktop.ps1 -Proof cua -TimeLimitMinutes 35
      - name: Live viewer proof
        if: ${{ !cancelled() && steps.browser.outcome == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.perf_workload) }}
        timeout-minutes: 20
        shell: pwsh
        run: ./scripts/ci/run-hosted-desktop.ps1 -Proof viewer -TimeLimitMinutes 15
      - name: Live takeover proof
        if: ${{ !cancelled() && steps.browser.outcome == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.perf_workload) }}
        timeout-minutes: 20
        shell: pwsh
        run: ./scripts/ci/run-hosted-desktop.ps1 -Proof takeover -TimeLimitMinutes 15
      # On demand only: the workflow_dispatch input perf_workload. Never a gate.
      - name: Performance workload (on demand)
        if: ${{ !cancelled() && steps.browser.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.perf_workload }}
        timeout-minutes: 30
        shell: pwsh
        run: ./scripts/ci/run-hosted-desktop.ps1 -Proof perf -TimeLimitMinutes 25
      - name: Live proof evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-proof-evidence
          path: ${{ runner.temp }}/hosted-desktop-evidence
          retention-days: 7
          if-no-files-found: error
      - name: Performance workload result
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.perf_workload }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: perf-workload-result
          path: ${{ runner.temp }}/hosted-desktop-evidence/perf
          retention-days: 90
          if-no-files-found: error

  desktop-recording:
    name: Live RDP recording proof
    runs-on: windows-latest
    # At least the sum of the step timeouts: build, recording dependencies and
    # the live recording proof (65), plus setup and upload. It runs on every
    # event, a perf dispatch included.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Enable MSVC developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build the source bridge and clients
        id: build
        timeout-minutes: 20
        run: cargo build --release --locked -p rdpilot-cli -p rdpilot-daemon -p rdpilot-mcp -p rdpilot-bridge --target x86_64-pc-windows-msvc
      - name: Recording proof dependencies
        id: deps
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 10
        shell: pwsh
        run: |
          python -m pip install playwright==1.63.0 Pillow==12.3.0 numpy==2.5.4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m playwright install chromium firefox
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          choco install ffmpeg --version 9.0.2 -y --no-progress
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # The media checks decode AV1 segments.
          $decoders = & ffmpeg -hide_banner -decoders
          if ($LASTEXITCODE -or -not ($decoders | Select-String -Pattern '\b(libdav1d|libaom-av1)\b')) { throw 'ffmpeg has no AV1 decoder' }
          & ffprobe -hide_banner -version | Select-Object -First 1
          if ($LASTEXITCODE) { throw 'ffprobe does not run' }
          (Get-Command ffmpeg).Source
      - name: Live recording proof
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        timeout-minutes: 35
        shell: pwsh
        run: ./scripts/ci/run-hosted-desktop.ps1 -Proof recording -TimeLimitMinutes 30
      - name: Live recording proof evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-recording-proof-evidence
          path: ${{ runner.temp }}/hosted-desktop-evidence
          retention-days: 7
          if-no-files-found: error

  evidence-matrix:
    name: Evidence matrix (report only)
    if: ${{ always() }}
    needs: [linux, windows, windows-dacl, offline, desktop, desktop-recording]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Report only: a failure here must not fail the called workflow of a release.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Artifacts of this run
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ${{ runner.temp }}/ci-artifacts
      - name: Render the evidence matrix
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
        run: python scripts/ci/evidence-matrix.py render --artifacts "$RUNNER_TEMP/ci-artifacts" --output "$RUNNER_TEMP/evidence-matrix"
      - name: Evidence matrix artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-matrix
          path: ${{ runner.temp }}/evidence-matrix
          retention-days: 7
          if-no-files-found: error

  success:
    name: Required checks success
    if: ${{ always() }}
    needs: [linux, windows, windows-dacl, offline, desktop, desktop-recording]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require every predecessor
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/check-ci-results.py linux windows windows-dacl offline desktop desktop-recording
