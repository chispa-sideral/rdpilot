[build]
# This machine is ARM64 (aarch64) Windows with no MSVC toolchain / Windows SDK.
# Build x64 binaries with the GNU (MinGW-w64) toolchain instead; they run under
# Windows-on-ARM x64 emulation (tier-1 target). Functionally equivalent for a
# pure-Rust RDP client (IronRDP + rustls, no MSVC-specific dependencies).
target = "x86_64-pc-windows-gnu"

[target.x86_64-pc-windows-gnu]
# Pin the MinGW-w64 gcc linker installed via `scoop install mingw`. Avoids the
# MSYS/coreutils `link` shadowing the real linker on PATH.
linker = "C:\\Users\\marc\\scoop\\apps\\mingw\\current\\bin\\gcc.exe"
